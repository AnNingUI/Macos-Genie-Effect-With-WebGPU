<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebGPU macOS Genie Effect · HTML-in-Canvas</title>
</head>

<body>
  <div id="stage">
    <!--
      content="drawable" 让 canvas 的子元素参与布局，并可被捕获成纹理。
      内部的 #genie-window 是**真实 HTML**（不再是 canvas2d 手绘的假窗口）：
      可点、可输入、可用键盘、对屏幕阅读器可见。
      Genie 变形完全由 WebGPU shader 负责，与 DOM 内容解耦。
    -->
    <canvas id="webgpu-canvas" content="drawable" width="800" height="600">
      <div id="genie-window" drawable>
        <div class="titlebar">
          <div class="lights">
            <span class="light close"></span>
            <span class="light min"></span>
            <span class="light max"></span>
          </div>
          <div class="title">Notes — 今日待办</div>
          <div class="titlebar-right"></div>
        </div>

        <div class="body">
          <aside class="sidebar">
            <div class="side-item active">全部笔记</div>
            <div class="side-item">工作</div>
            <div class="side-item">灵感</div>
            <div class="side-item">归档</div>
          </aside>

          <main class="content">
            <h1>今日待办</h1>
            <p class="meta">2026 年 11 月 21 日 · 周六</p>

            <ul class="todos">
              <li><label><input type="checkbox" checked /><span>把 Genie 效果改成真实 HTML</span></label></li>
              <li><label><input type="checkbox" /><span>验证吸入动画期间的命中测试</span></label></li>
              <li><label><input type="checkbox" /><span>整理踩坑记录到 README</span></label></li>
            </ul>

            <label class="field">
              <span>快速添加</span>
              <input id="new-todo" type="text" placeholder="输入后按 Enter…" />
            </label>

            <div class="hint" id="hint">这个窗口是真的 DOM —— 试试点复选框、输入文字。</div>
          </main>
        </div>
      </div>
    </canvas>
  </div>

  <div id="controls">
    <button id="genie-btn">Start Genie Effect</button>
    <button id="reset-btn">Reset</button>
    <label id="dir-wrap">
      收缩方向
      <select id="dir-select"></select>
    </label>
  </div>
  <div id="info">Click 'Start Genie Effect' to animate the window.</div>

  <div id="unsupported" hidden>
    <h2>需要支持 HTML-in-Canvas 的浏览器</h2>
    <p>请使用 Chrome 155+（默认开放），或 Chrome 138+ 并开启
      <code>chrome://flags/#canvas-draw-element</code>。</p>
    <p id="unsupported-detail"></p>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
